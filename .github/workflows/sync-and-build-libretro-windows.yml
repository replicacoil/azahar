name: Sync upstream and build libretro core (Windows x64)

on:
  push:
    branches: [ "retroarch-home-menu" ]
  schedule:
    - cron: '0 */6 * * *'   # check upstream every 6 hours; adjust or remove as you like
  workflow_dispatch: {}      # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # the sync job pushes merge commits back to this fork

jobs:
  sync-upstream:
    # Only needed on a schedule/manual run. A push already contains your latest
    # commit, so there's nothing to sync in that case.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: retroarch-home-menu
          fetch-depth: 0   # full history so the merge has a common ancestor to work from

      - name: Merge upstream/retroarch-live into this fork
        run: |
          git remote add upstream https://github.com/azahar-emu/azahar.git
          git fetch upstream retroarch-live
          git merge upstream/retroarch-live --no-edit
          git push origin HEAD:retroarch-home-menu

  build-windows:
    needs: sync-upstream
    # Run whether sync-upstream succeeded (schedule/manual) or was skipped (push).
    # Do NOT run if it actually failed (e.g. merge conflict) - that needs your attention first.
    if: always() && (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      # Same flags/image the upstream project's own libretro.yml uses for its Windows build.
      CORE_ARGS: -DENABLE_LIBRETRO=ON -DENABLE_LTO=OFF -G Ninja
      BUILD_DIR: build/windows-x86_64
      IMAGE: reallibretroretroarch/libretro-build-mxe-win-cross-cores:mingw12
      CMAKE: x86_64-w64-mingw32.static-cmake
    steps:
      - name: Check out fork (post-sync)
        uses: actions/checkout@v4
        with:
          ref: retroarch-home-menu
          submodules: recursive

      - name: Cross-compile azahar_libretro.dll
        run: |
          docker pull $IMAGE
          docker run --rm --user root \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            $IMAGE \
            bash -lc "\
              ${CMAKE} $CORE_ARGS . -B $BUILD_DIR && \
              ${CMAKE} --build $BUILD_DIR --target citra_libretro --config Release -j \$(nproc) && \
              x86_64-w64-mingw32.static-strip -s $BUILD_DIR/bin/Release/azahar_libretro.*"

      - name: Upload azahar_libretro.dll
        uses: actions/upload-artifact@v4
        with:
          name: azahar_libretro-windows-x64
          path: ${{ env.BUILD_DIR }}/bin/Release/azahar_libretro.dll
          if-no-files-found: error
